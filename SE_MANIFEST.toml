# ============================================================
# SE_MANIFEST.toml (Repository Declaration)
# ============================================================

schema = "se-manifest-schema"
schema_version = "0.5.0"
schema_url = "https://raw.githubusercontent.com/structural-explainability/se-manifest-schema/main/manifest-schema.toml"

# === Framework Context ===

[meta]
framework = "Structural Explainability"
framework_url = "https://github.com/structural-explainability"
purpose = "Declares this repository's role in the Structural Explainability ecosystem."

# === Repository Identity ===

[repository]
organization = "structural-explainability"
name = "paper-200-identity-regimes"
class = "paper"
kind = "paper"
status = "active"
since = "2026"
summary = "Paper investigating transformation-based identity profiles for neutral substrates, establishing finite classification results and identifying unresolved scientific adequacy and non-amalgamation requirements."

# === Layer Position ===

[layer]
space = "structural-explainability"
role = "justification-identity"

# === Dependency Declarations ===

[depends]
required = [
    { repository = "paper-100-neutral-substrate", kind = "semantic", reason = "Uses the conditional semantic-neutrality result and referential framework developed in Neutral Substrates." },
    { repository = "se-theory-identity-regimes", kind = "semantic", reason = "Companion Lean 4 formalization of the derived classification cells and step-generated relations reported here." },
]
optional = []

# === Provided Artifacts ===

[provides]
artifacts = [
    ".annotations/annotations.md",
    "CITATION.cff",
    "LICENSE",
    "README.md",
    "SE_MANIFEST.toml",
    "se200_referential_regimes.tex",
    "sections/*.tex",
    "lean-basis.md"
]

# === Scope ===

[scope]
includes = [
    "referential-regime analysis for neutral substrates",
    "individuation, co-reference, and persistence under transformation",
    "six selected reference kinds for accountability analysis",
    "nine candidate carrier-basis identity profiles",
    "locus-fixed and object-fixed profiles for plain referents",
    "extension-fixed and structure-fixed profiles for scopes",
    "content-fixed and structure-fixed profiles for rules",
    "finite transformation classification",
    "pairwise distinctions among selected classification functions",
    "determinate assignment within the selected carrier-basis catalog",
    "persistence of classification distinctions under compatible transformation-basis extensions",
    "carrier-indexed combination construction",
    "distinction between classification profiles, generated relations, and strict identity",
    "scientific adequacy and non-amalgamation questions",
    "boundary conditions for stable reference",
]
excludes = [
    "universal nine-regime lower-bound claim",
    "proof of irreducible identity-regime count",
    "proof of non-amalgamation for candidate identity relations",
    "independent establishment of strict identity for intended referents",
    "unconditional guarantee of referential common ground",
    "upper-bound claim for identity regimes",
    "completeness claim for all admissible identity bases",
    "completeness claim for all possible ontological systems",
    "normative specification text",
    "implementation requirements",
    "exchange or state-transition protocols",
    "verification tooling for accountable records",
]

# === Citation ===

[citation]
cff = "CITATION.cff"
preferred = "paper"

# === Traceability ===

[traceability]
identifier_map = "none"
