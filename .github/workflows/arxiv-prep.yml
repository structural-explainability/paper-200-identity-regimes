# ============================================================
# .github/workflows/arxiv-prep.yml
# ============================================================
# Updated: 2026-10-27

# WHY: Prepare and verify LaTeX source for arXiv submission.
# OBS: Package only required source files.
# OBS: Compile from the extracted submission ZIP.
# REQ: Commit and push manuscript changes before running.
# ALT: Manual trigger for new submissions or replacement versions.

name: Prepare arXiv Source

on:
  workflow_dispatch: # WHY: Manual trigger only

permissions:
  contents: read # WHY: Required to checkout repository files for link inspection.

jobs:
  arxiv-source:
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # ASSEMBLE: Checkout and configure TeX
      # ============================================================

      - name: A1) Checkout repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
        # WHY: Make repository files available so their links can be inspected.

      # WHY: Install TeX Live in CI in a maintainable way
      # OBS: This action installs tlmgr, but does not install TeX packages unless specified
      - name: A2) Setup TeX Live
        uses: TeX-Live/setup-texlive-action@eb78d21f41941476d9121e3a0abcab73265c876f # v4
        with:
          package-file: .github/tl_packages
          cache: true

      - name: A3) Verify TeX tools
        run: |
          set -euo pipefail
          kpsewhich authblk.sty
          command -v pdflatex
          command -v latexmk
          latexmk --version

      # ============================================================
      # BUILD: Build source-only arXiv ZIP
      # ============================================================

      - name: B1) Stage source files
        run: |
          set -euo pipefail

          mkdir -p arxiv_src

          cp se200_referential_regimes.tex arxiv_src/
          cp -r sections arxiv_src/

      - name: B2) Create source ZIP
        run: |
          set -euo pipefail

          cd arxiv_src
          zip -q -r ../arxiv-source.zip .

      - name: B3) Verify ZIP contents
        run: |
          set -euo pipefail

          unzip -t arxiv-source.zip
          unzip -Z1 arxiv-source.zip

      # ============================================================
      # COMPILE: Compile from the actual submission archive
      # ============================================================

      - name: C1) Extract source ZIP
        run: |
          set -euo pipefail

          mkdir -p arxiv_check
          unzip -q arxiv-source.zip -d arxiv_check

      - name: C2) Compile extracted LaTeX source
        working-directory: arxiv_check
        run: |
          set -euo pipefail

          latexmk \
            -pdf \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            se200_referential_regimes.tex

          test -s se200_referential_regimes.pdf

      # ============================================================
      # DELIVERABLES: Upload files to GitHub Actions for manual download
      # ============================================================

      - name: D1) Upload arXiv source ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: arxiv-source
          path: arxiv-source.zip
          retention-days: 7
          if-no-files-found: error

      - name: D2) Upload verification PDF
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: compiled-pdf
          path: arxiv_check/se200_referential_regimes.pdf
          retention-days: 7
          if-no-files-found: error
